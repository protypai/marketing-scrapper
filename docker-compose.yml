version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# LeadHub Marketing Scrapper — Application Stack (PumpPilot Standard)
# Configured for Production & Coolify Deployment
# ─────────────────────────────────────────────────────────────────────────────

networks:
  scrapper-network:
    name: scrapper_shared_network
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: scrapper_postgres
    restart: unless-stopped
    networks: [scrapper-network]
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-leadhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-leadhub} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrapper_app
    restart: unless-stopped
    networks: [scrapper-network]
    expose:
      - "8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_2026}@postgres:5432/${POSTGRES_DB:-leadhub}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN:-apify_api_GYzwyehhEZnNVzq2TQwB6BT6gHImIf3B9WPf}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@protypai.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@PumpPharma2026}
      - ADMIN_NAME=${ADMIN_NAME:-Admin User}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
